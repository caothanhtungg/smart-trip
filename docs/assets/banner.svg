<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12" />
      <stop offset="45%" stop-color="#0C1527" />
      <stop offset="100%" stop-color="#08101E" />
    </linearGradient>

    <!-- Glowing Blobs -->
    <radialGradient id="glow-emerald" cx="20%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-cyan" cx="80%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.28" />
      <stop offset="65%" stop-color="#06B6D4" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-indigo" cx="50%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Text Gradients -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-opacity="0.16" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.08); }
    }
    .hero-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .hero-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: -0.01em;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="420" rx="16" fill="url(#glow-emerald)" />
  <rect width="1200" height="420" rx="16" fill="url(#glow-cyan)" />
  <rect width="1200" height="420" rx="16" fill="url(#glow-indigo)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Outer Glass Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#card-border)" stroke-width="1.5" />

  <!-- Abstract Route Polyline & Waypoints -->
  <g opacity="0.35">
    <path d="M 80 340 Q 250 180 440 260 T 780 180 T 1120 300" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 6" />
    <circle cx="80" cy="340" r="5" fill="#38BDF8" />
    <circle cx="440" cy="260" r="6" fill="#34D399" />
    <circle cx="780" cy="180" r="6" fill="#818CF8" />
    <circle cx="1120" cy="300" r="5" fill="#F472B6" />
  </g>

  <!-- Top Pill / Badge -->
  <g transform="translate(600, 52)">
    <rect x="-190" y="0" width="380" height="32" rx="16" fill="#1E293B" fill-opacity="0.75" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="-168" cy="16" r="4" fill="#34D399" />
    <text x="0" y="21" text-anchor="middle" fill="#E2E8F0" class="tag-text" letter-spacing="0.08em">
      ⚡ NEXT-GEN GROUP TRAVEL &amp; FINANCIAL ECOSYSTEM
    </text>
  </g>

  <!-- Logo & Title Section -->
  <g transform="translate(600, 155)">
    <!-- Main Title -->
    <text x="0" y="0" text-anchor="middle" class="hero-title" font-size="46" fill="url(#text-grad)">
      Smart Trip &amp; Expense Planner
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="44" text-anchor="middle" class="hero-sub" font-size="19" fill="#94A3B8">
      Nền tảng du lịch nhóm thông minh • Tối ưu đường đi TSP • Chia tiền minh bạch • VietQR EMVCo Napas 247
    </text>
  </g>

  <!-- Stats & Feature Badges Container -->
  <g transform="translate(60, 260)">
    
    <!-- Badge 1: TSP 2-Opt -->
    <g transform="translate(0, 0)">
      <rect width="202" height="64" rx="12" fill="url(#pill-bg)" stroke="#334155" stroke-width="1" />
      <rect x="12" y="14" width="36" height="36" rx="8" fill="#0284C7" fill-opacity="0.2" />
      <text x="30" y="38" text-anchor="middle" font-size="18">🗺️</text>
      <text x="58" y="31" fill="#F8FAFC" class="tag-text" font-size="13">Tối ưu Lộ trình</text>
      <text x="58" y="48" fill="#38BDF8" class="tag-text" font-size="11">TSP 2-Opt Heuristic</text>
    </g>

    <!-- Badge 2: Open-Meteo Weather -->
    <g transform="translate(220, 0)">
      <rect width="202" height="64" rx="12" fill="url(#pill-bg)" stroke="#334155" stroke-width="1" />
      <rect x="12" y="14" width="36" height="36" rx="8" fill="#0D9488" fill-opacity="0.2" />
      <text x="30" y="38" text-anchor="middle" font-size="18">🌦️</text>
      <text x="58" y="31" fill="#F8FAFC" class="tag-text" font-size="13">Thời tiết Thực tế</text>
      <text x="58" y="48" fill="#2DD4BF" class="tag-text" font-size="11">Open-Meteo API</text>
    </g>

    <!-- Badge 3: VietQR Napas 247 -->
    <g transform="translate(440, 0)">
      <rect width="202" height="64" rx="12" fill="url(#pill-bg)" stroke="#334155" stroke-width="1" />
      <rect x="12" y="14" width="36" height="36" rx="8" fill="#16A34A" fill-opacity="0.2" />
      <text x="30" y="38" text-anchor="middle" font-size="18">💳</text>
      <text x="58" y="31" fill="#F8FAFC" class="tag-text" font-size="13">VietQR Offline</text>
      <text x="58" y="48" fill="#4ADE80" class="tag-text" font-size="11">Chuẩn EMVCo Napas</text>
    </g>

    <!-- Badge 4: Security AES-256 -->
    <g transform="translate(660, 0)">
      <rect width="202" height="64" rx="12" fill="url(#pill-bg)" stroke="#334155" stroke-width="1" />
      <rect x="12" y="14" width="36" height="36" rx="8" fill="#6366F1" fill-opacity="0.2" />
      <text x="30" y="38" text-anchor="middle" font-size="18">🔒</text>
      <text x="58" y="31" fill="#F8FAFC" class="tag-text" font-size="13">Bảo mật Dữ liệu</text>
      <text x="58" y="48" fill="#A5B4FC" class="tag-text" font-size="11">AES-256-GCM + WAF</text>
    </g>

    <!-- Badge 5: 100% Tests -->
    <g transform="translate(880, 0)">
      <rect width="202" height="64" rx="12" fill="url(#pill-bg)" stroke="#334155" stroke-width="1" />
      <rect x="12" y="14" width="36" height="36" rx="8" fill="#E11D48" fill-opacity="0.2" />
      <text x="30" y="38" text-anchor="middle" font-size="18">🧪</text>
      <text x="58" y="31" fill="#F8FAFC" class="tag-text" font-size="13">1,357 Tests Passed</text>
      <text x="58" y="48" fill="#FB7185" class="tag-text" font-size="11">121 Vitest Suites (100%)</text>
    </g>

  </g>

  <!-- Bottom Accent Line -->
  <g transform="translate(60, 360)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#334155" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="540" cy="0" r="3" fill="#38BDF8" />
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(600, 388)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" fill="#64748B">
      Full-Stack Next.js 16.4 • React 19 • Tailwind CSS 4 • Prisma 7 • Supabase PostgreSQL • Better Auth
    </text>
  </g>
</svg>
