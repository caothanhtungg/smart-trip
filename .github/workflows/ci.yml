name: CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint & Offline Tests
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NODE_ENV: test
      BETTER_AUTH_SECRET: "ci-dummy-better-auth-secret-min-32-chars"
      BETTER_AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      DATABASE_URL: "postgresql://postgres:dummy@localhost:5432/postgres"
      BANK_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      GOOGLE_CLIENT_ID: "ci-dummy-google-client-id"
      GOOGLE_CLIENT_SECRET: "ci-dummy-google-client-secret"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: ESLint Check
        run: npm run lint

      - name: Run Vitest Offline Test Suite
        run: npm test
